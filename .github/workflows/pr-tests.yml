name: PR unit tests

# Runs the up_layout library unit tests for every pull request targeting develop.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # up_layout tests run on iosSimulatorArm64, which requires macOS.
    runs-on: macos-latest
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run library unit tests
        run: ./gradlew :up_layout:allTests --console=plain
